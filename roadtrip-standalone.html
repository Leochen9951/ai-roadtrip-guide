<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI 路书</title>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f14;--surface:#1a1a24;--border:#2a2a38;--text:#e8e8ec;--text2:#9090a0;
  --accent:#4da6ff;--accent2:#ff6b6b;--green:#4ecb71;--radius:8px
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;user-select:none
}

/* 顶部状态栏 */
.topbar{
  background:var(--surface);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);min-height:52px;z-index:10;flex-shrink:0
}
.topbar h1{font-size:18px;font-weight:600;letter-spacing:.5px}
.topbar .status{font-size:12px;color:var(--text2)}
.topbar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.dot.gps{background:var(--green);animation:pulse 2s infinite}
.dot.nogps{background:var(--accent2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 主体内容区 */
.main{
  flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:12px
}

/* 当前位置卡片 */
.location-card{
  background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid var(--border)
}
.location-card .label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.location-card .city-name{font-size:28px;font-weight:700;line-height:1.2}
.location-card .province{font-size:14px;color:var(--text2)}
.location-card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.location-card .tag{
  background:rgba(77,166,255,.15);color:var(--accent);padding:2px 8px;border-radius:12px;font-size:11px
}
.location-card .distance{font-size:12px;color:var(--green);margin-top:4px}

/* 讲解内容卡片 */
.narration-card{
  background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid var(--border);
  min-height:80px
}
.narration-card .label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.narration-card .content{font-size:16px;line-height:1.7;color:var(--text)}
.narration-card .content.placeholder{color:var(--text2);font-style:italic}
.narration-card .attribution{font-size:11px;color:var(--text2);margin-top:8px;text-align:right}

/* 控制区 */
.controls{
  display:flex;gap:8px;flex-shrink:0;padding:0 16px 16px
}
.btn{
  flex:1;padding:14px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;
  cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;
  -webkit-tap-highlight-color:transparent;min-height:48px
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{transform:scale(.97);opacity:.9}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:active{background:var(--border)}
.btn-danger{background:var(--accent2);color:#fff}
.btn-danger:active{transform:scale(.97);opacity:.9}
.btn:disabled{opacity:.4;pointer-events:none}

/* 语音指示器 */
.speaking-indicator{
  display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(78,203,113,.12);
  border-top:1px solid rgba(78,203,113,.3);flex-shrink:0
}
.speaking-indicator .wave{display:flex;gap:2px;align-items:flex-end;height:16px}
.speaking-indicator .wave span{
  width:3px;background:var(--green);border-radius:2px;
  animation:wave .8s ease-in-out infinite
}
.speaking-indicator .wave span:nth-child(1){height:8px;animation-delay:0s}
.speaking-indicator .wave span:nth-child(2){height:16px;animation-delay:.1s}
.speaking-indicator .wave span:nth-child(3){height:12px;animation-delay:.2s}
.speaking-indicator .wave span:nth-child(4){height:6px;animation-delay:.3s}
.speaking-indicator .wave span:nth-child(5){height:14px;animation-delay:.4s}
@keyframes wave{0%,100%{opacity:.5;transform:scaleY(1)}50%{opacity:1;transform:scaleY(.6)}}

/* 设置面板 */
.settings{
  position:fixed;top:0;right:0;width:100%;max-width:360px;height:100%;background:var(--surface);
  z-index:100;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;
  box-shadow:-4px 0 20px rgba(0,0,0,.5)
}
.settings.open{transform:translateX(0)}
.settings-header{
  padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center
}
.settings-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.setting-group{display:flex;flex-direction:column;gap:8px}
.setting-group label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.setting-group select,.setting-group input{
  background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;font-size:14px;width:100%
}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:99;display:none}
.overlay.show{display:block}

/* 历史记录 */
.history-item{
  padding:12px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);
  cursor:pointer;transition:all .15s
}
.history-item:active{background:var(--border)}
.history-item .time{font-size:11px;color:var(--text2)}
.history-item .text{font-size:14px;margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Toast */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--surface);
  color:var(--text);padding:10px 20px;border-radius:20px;font-size:14px;z-index:200;
  box-shadow:0 4px 16px rgba(0,0,0,.4);opacity:0;transition:opacity .3s;pointer-events:none
}
.toast.show{opacity:1}

/* 响应式 */
@media(min-width:600px){
  .main{max-width:500px;margin:0 auto}
  .controls{max-width:500px;margin:0 auto}
}

</style>
</head>

async function requestNarration(){if(STATE.isSpeaking){stopSpeaking();return}if(STATE.isRequesting)return;STATE.isRequesting=true;var btn=document.getElementById("btnNarrate");btn.disabled=true;btn.textContent="思考中...";try{var p="";if(STATE.currentAttraction)p="我正开车经过"+STATE.currentCity.name+"的「"+STATE.currentAttraction.name+"」，讲讲这里的趣事。";else if(STATE.currentCity)p="我正开车经过"+STATE.currentCity.name+"（标签："+(STATE.currentCity.tags||[]).join("、")+"），讲讲这座城市。";else p="聊聊一个中国有趣的旅行目的地。";var ck=(STATE.currentCity?STATE.currentCity.name:"")+"|"+(STATE.currentAttraction?STATE.currentAttraction.name:"");var t="";if(STATE.narrationCache[ck]&&Date.now()-STATE.narrationCache[ck].time<3600000)t=STATE.narrationCache[ck].text;else{t=await callAI(p);STATE.narrationCache[ck]={text:t,time:Date.now()}}showNarration(t);speakNarration(t);STATE.lastNarrationTime=Date.now();addHistory(t);btn.textContent="停止"}catch(e){showToast("失败: "+e.message)}STATE.isRequesting=false;btn.disabled=false}
function showNarration(t){document.getElementById("narrationText").className="content";document.getElementById("narrationText").textContent=t;var l="";if(STATE.currentAttraction)l="—— "+STATE.currentCity.name+" · "+STATE.currentAttraction.name;else if(STATE.currentCity)l="—— "+STATE.currentCity.name;document.getElementById("narrationAttr").textContent=l}
var VOLC_VOICES=[{id:"BV001_streaming",name:"通用女声"},{id:"BV002_streaming",name:"通用男声"},{id:"BV522_streaming",name:"气质女声(日)"},{id:"BV021_streaming",name:"东北老铁"},{id:"BV524_streaming",name:"日语男声"},{id:"BV701_streaming",name:"擎苍"},{id:"BV113_streaming",name:"甜宠少御"},{id:"BV504_streaming",name:"活力男声Jackson"},{id:"BV007_streaming",name:"亲切女声"},{id:"BV213_streaming",name:"广西表哥"},{id:"BV005_streaming",name:"活泼女声"},{id:"BV119_streaming",name:"通用赘婿"},{id:"BV705_streaming",name:"炀炀"},{id:"BV700_streaming",name:"灿灿"},{id:"BV102_streaming",name:"儒雅青年"},{id:"BV019_streaming",name:"重庆小伙"},{id:"BV503_streaming",name:"活力女声Ariana"},{id:"BV115_streaming",name:"古风少御"}];
function getVoiceIdx(){var i=parseInt(localStorage.getItem("rt_vi"));return isNaN(i)?0:i}
function saveVoice(){var v=parseInt(document.getElementById("ttsVoice").value);if(!isNaN(v)){localStorage.setItem("rt_vi",v);showToast(VOLC_VOICES[v].name)}loadVoices();showVoiceInd();if(STATE.isSpeaking&&STATE.currentNarrationText){var resumeIdx=STATE.currentSentenceIdx;stopSpeaking();setTimeout(function(){speakNarration(STATE.currentNarrationText,resumeIdx)},200)}else if(!STATE.isSpeaking){var preview="" + VOLC_VOICES[v].name + "，你好，我是你的AI路书语音导游";speakNarration(preview)}clearTimeout(STATE._svTimer);STATE._svTimer=setTimeout(function(){document.getElementById("settingsPanel").classList.remove("open");document.getElementById("overlay").classList.remove("show")},15000)}
function loadVoices(){var sel=document.getElementById("ttsVoice");if(!sel)return;sel.innerHTML="";VOLC_VOICES.forEach(function(v,i){var o=document.createElement("option");o.value=i;o.textContent=v.name;sel.appendChild(o)});sel.value=getVoiceIdx();showVoiceInd()}
function showVoiceInd(){var vi=getVoiceIdx();document.getElementById("voiceIndicator").textContent=VOLC_VOICES[vi]?VOLC_VOICES[vi].name:""}
var activeAudios=[];
async function speakNarration(text,resumeFrom){stopSpeaking();if(!text)return;STATE.currentNarrationText=text;STATE.isSpeaking=true;document.getElementById("speakingBar").style.display="flex";document.getElementById("btnNarrate").textContent="停止";var vi=getVoiceIdx();var parts=text.replace(/\n/g,"。").split(/[。！？]+/).filter(function(s){return s.trim().length>0});if(parts.length===0)parts=[text];var idx=resumeFrom||0;STATE.currentSentenceIdx=idx;while(idx<parts.length&&STATE.isSpeaking){var t=parts[idx].substring(0,280);var u="/api/tts?text="+encodeURIComponent(t)+"&v="+vi;var a=new Audio();activeAudios.push(a);a.src=u;try{await new Promise(function(resolve,reject){var done=false;a.onended=function(){if(!done){done=true;activeAudios=activeAudios.filter(function(x){return x!==a});resolve()}};var p=a.play();if(p&&p.then)p.then(function(){}).catch(function(){if(!done){done=true;activeAudios=activeAudios.filter(function(x){return x!==a});resolve()}})})}catch(e){}idx++;STATE.currentSentenceIdx=idx}STATE.isSpeaking=false;document.getElementById("speakingBar").style.display="none";document.getElementById("btnNarrate").textContent="讲讲这里"}function stopSpeaking(){STATE.isSpeaking=false;if(speechSynthesis&&speechSynthesis.speaking)speechSynthesis.cancel();activeAudios.forEach(function(a){a.pause();a.src=""});activeAudios=[];document.getElementById("speakingBar").style.display="none";document.getElementById("btnNarrate").textContent="讲讲这里"}
function toggleAuto(){STATE.autoMode=!STATE.autoMode;var b=document.getElementById("btnAuto");b.className=STATE.autoMode?"btn btn-secondary":"btn btn-danger";b.textContent=STATE.autoMode?"自动 · 开":"自动 · 关";showToast(STATE.autoMode?"自动讲解已开启":"已关闭")}
function addHistory(text){STATE.history.unshift({time:new Date().toLocaleTimeString("zh-CN"),text:text,city:STATE.currentCity?STATE.currentCity.name:null,attr:STATE.currentAttraction?STATE.currentAttraction.name:null});if(STATE.history.length>50)STATE.history.length=50;localStorage.setItem("rt_h",JSON.stringify(STATE.history));renderHistory()}
function renderHistory(){var c=document.getElementById("historyCard"),l=document.getElementById("historyList");if(!STATE.history.length)return;if(c.style.display!=="none")c.style.display="block";l.innerHTML=STATE.history.slice(0,10).map(function(h,i){return "<div class=history-item onclick=replayHistory("+i+")><div class=time>"+h.time+" · "+(h.city||"?")+"</div><div class=text>"+h.text+"</div></div>"}).join("")}
function replayHistory(i){var h=STATE.history[i];if(!h)return;showNarration(h.text);stopSpeaking();clearTimeout(STATE._rhTimer);STATE._rhTimer=setTimeout(function(){speakNarration(h.text)},150)}
function clearHistory(){STATE.history=[];localStorage.removeItem("rt_h");renderHistory();showToast("已清除")}
function toggleHistory(){var c=document.getElementById("historyCard"),b=document.getElementById("historyToggle");if(c.style.display==="none"){c.style.display="block";b.textContent="收起记录"}else{c.style.display="none";b.textContent="查看讲解记录"}}
function initDebugCities(){var sel=document.getElementById("debugCity");if(!sel)return;CITY_DATA.forEach(function(c){var o=document.createElement("option");o.value=c.lat+","+c.lng+","+c.name;o.textContent=c.name+" ("+c.province+")";sel.appendChild(o)})}
function debugSetCity(){var v=document.getElementById("debugCity").value;if(!v){debugOverride=null;STATE.gps=null;startGPS();updateGPSStatus(false);showToast("已切回真实GPS");return}var p=v.split(",");debugOverride={lat:parseFloat(p[0]),lng:parseFloat(p[1]),name:p[2]};STATE.gps={lat:debugOverride.lat,lng:debugOverride.lng};updateGPSStatus(true);console.log("GPS OK:",p.coords);findNearestCity();document.getElementById("settingsPanel").classList.remove("open");document.getElementById("overlay").classList.remove("show");if(!started)doStart();else setTimeout(function(){requestNarration()},500)}
initDebugCities();
if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){speechSynthesis.getVoices()}}
var startOverlay=document.createElement("div");startOverlay.id="startOverlay";startOverlay.innerHTML="<div style=position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px><div style=font-size:48px>🚗</div><div style=font-size:22px;font-weight:700;color:var(--text)>AI 路书 · 车载导游</div><div style=font-size:14px;color:var(--text2);text-align:center;line-height:1.8>开车时自动为你讲解<br>沿途城市和景点的故事</div><button onclick=doStart() style=background:var(--accent);color:#fff;border:none;padding:16px 48px;border-radius:24px;font-size:18px;font-weight:600;cursor:pointer;margin-top:12px>开始旅程</button></div>";document.body.appendChild(startOverlay);
function doStart(){started=true;if(!getApiKey()){setTimeout(function(){toggleSettings()},500)}var u=new SpeechSynthesisUtterance("");u.volume=0;speechSynthesis.speak(u);startGPS();renderHistory();setInterval(function(){if(STATE.gps)findNearestCity()},10000);startOverlay.style.display="none";if(debugOverride)setTimeout(function(){requestNarration()},1000)}
</script>
